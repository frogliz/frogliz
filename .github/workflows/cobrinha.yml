name: cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a cobrinha a partir das contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#d1cfec&color_dots=#11141f,#132c66,#2350b8,#3d73f2,#89befa
            dist/snake-light.svg?color_snake=#000000&color_dots=#eceef5,#b9cdf6,#7aa3f4,#3d73f2,#2350b8

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
